<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Contact the library</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container">
    <h1 class="page-title">Contact / query</h1>
    <div class="card form-card">
        <div class="alert success" th:if="${success}" th:text="${success}"></div>
        <form th:action="@{/contact}" method="post">
            <label for="name">Your name</label>
            <input type="text" id="name" name="name" required/>

            <label for="email">Your email</label>
            <input type="email" id="email" name="email" required/>

            <label for="message">Message</label>
            <textarea id="message" name="message" required placeholder="Ask about a book, an account issue, or anything else..."></textarea>

            <button class="btn" type="submit">Send message</button>
        </form>
    </div>
</main>
<!-- <div th:replace="~{fragments/footer :: footer}"></div> -->
</body>
</html>
