<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${book.id == null} ? 'Add Book' : 'Edit Book '">Book form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container">
    <h1 class="page-title" th:text="${book.id == null} ? 'Add a new book' : 'Edit book'">Add book</h1>
    <div class="card form-card">
        <form th:action="@{/admin/books/save}" method="post" th:object="${book}">
            <input type="hidden" th:field="*{id}"/>

            <label for="title">Title</label>
            <input type="text" id="title" th:field="*{title}" required/>

            <label for="author">Author</label>
            <input type="text" id="author" th:field="*{author}" required/>

            <label for="isbn">ISBN</label>
            <input type="text" id="isbn" th:field="*{isbn}" required/>

            <label for="category">Category</label>
            <input type="text" id="category" th:field="*{category}" placeholder="e.g. Fiction, Science, History" required/>

            <label for="quantity">Total quantity (copies owned)</label>
            <input type="number" id="quantity" th:field="*{quantity}" min="0" required/>

            <button class="btn" type="submit">Save book</button>
            <a class="btn ghost" th:href="@{/admin/books}">Cancel</a>
        </form>
    </div>
</main>
<!-- <div th:replace="~{fragments/footer :: footer}"></div> -->
</body>
</html>
