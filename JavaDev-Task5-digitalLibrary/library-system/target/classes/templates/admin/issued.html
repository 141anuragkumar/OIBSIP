<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Issued Books</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container">
    <h1 class="page-title">Issued books</h1>

    <table class="ledger" th:if="${!records.isEmpty()}">
        <thead>
        <tr><th>Book</th><th>Member</th><th>Issued</th><th>Due</th><th>Status</th></tr>
        </thead>
        <tbody>
        <tr th:each="r : ${records}">
            <td th:text="${r.book.title}">Title</td>
            <td th:text="${r.member.name} + ' (' + ${r.member.email} + ')'">Member</td>
            <td th:text="${r.issueDate}">date</td>
            <td th:text="${r.dueDate}">date</td>
            <td>
                <span th:if="${r.dueDate.isBefore(T(java.time.LocalDate).now())}" class="pill overdue">Overdue</span>
                <span th:unless="${r.dueDate.isBefore(T(java.time.LocalDate).now())}" class="pill ontime">On time</span>
            </td>
        </tr>
        </tbody>
    </table>
    <div class="empty-state" th:if="${records.isEmpty()}">No books are currently issued.</div>
</main>
<!-- <div th:replace="~{fragments/footer :: footer}"></div> -->
</body>
</html>
