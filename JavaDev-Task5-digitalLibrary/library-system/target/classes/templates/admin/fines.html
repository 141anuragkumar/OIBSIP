<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Fines</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container">
    <h1 class="page-title">Outstanding fines</h1>
    <div class="alert success" th:if="${success}" th:text="${success}"></div>

    <table class="ledger" th:if="${!records.isEmpty()}">
        <thead>
        <tr><th>Book</th><th>Member</th><th>Due date</th><th>Returned</th><th>Fine</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="r : ${records}">
            <td th:text="${r.book.title}">Title</td>
            <td th:text="${r.member.name} + ' (' + ${r.member.email} + ')'">Member</td>
            <td th:text="${r.dueDate}">date</td>
            <td th:text="${r.returnDate}">date</td>
            <td th:text="'₹' + ${r.fineAmount}">₹0</td>
            <td>
                <form th:action="@{'/admin/fines/' + ${r.id} + '/paid'}" method="post">
                    <button class="btn small" type="submit">Mark as paid</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <div class="empty-state" th:if="${records.isEmpty()}">No unpaid fines right now.</div>
</main>
<!-- <div th:replace="~{fragments/footer :: footer}"></div> -->
</body>
</html>
