<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Catalogue</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container">
    <h1 class="page-title">Catalogue</h1>

    <div class="alert success" th:if="${success}" th:text="${success}"></div>
    <div class="alert error" th:if="${error}" th:text="${error}"></div>

    <div class="tabs">
        <a th:href="@{/catalogue}" th:classappend="${selectedCategory == null} ? 'active'">All</a>
        <a th:each="c : ${categories}" th:href="@{/catalogue(category=${c})}"
           th:text="${c}" th:classappend="${selectedCategory == c} ? 'active'"></a>
    </div>

    <div class="catalogue-grid" th:if="${!books.isEmpty()}">
        <div class="book-card" th:each="book : ${books}">
            <span class="stamp" th:classappend="${book.availableQuantity > 0} ? 'available' : 'out'"
                  th:text="${book.availableQuantity > 0} ? (${book.availableQuantity} + ' available') : 'all copies out'"></span>
            <div class="eyebrow" th:text="${book.category}">Category</div>
            <h3 th:text="${book.title}">Title</h3>
            <div class="author" th:text="'by ' + ${book.author}">Author</div>
            <div class="meta" th:text="'ISBN ' + ${book.isbn}">ISBN</div>
            <div style="margin-top:14px;">
                <form th:if="${book.availableQuantity > 0}" th:action="@{'/issue/' + ${book.id}}" method="post" style="display:inline;">
                    <button class="btn small" type="submit">Issue this book</button>
                </form>
                <form th:if="${book.availableQuantity == 0}" th:action="@{'/reserve/' + ${book.id}}" method="post" style="display:inline;">
                    <button class="btn small secondary" type="submit">Reserve (advance booking)</button>
                </form>
            </div>
        </div>
    </div>

    <div class="empty-state" th:if="${books.isEmpty()}">
        No books found in this category yet.
    </div>
</main>
</body>
</html>
