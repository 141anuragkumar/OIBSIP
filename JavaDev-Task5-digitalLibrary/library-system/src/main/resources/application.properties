spring.application.name=library-system
# server.port=8080
```properties
server.port=${PORT:10000}
```


# ---------- SQLite database (file created next to the jar as library.db) ----------
spring.datasource.url=jdbc:sqlite:library.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- Library business rules ----------
library.issue.loan-days=14
library.fine.per-day=5.0

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false

# ---------- Seed admin account (created on first run if it doesn't exist) ----------
library.seed.admin-email=admin@library.com
library.seed.admin-password=admin123
