<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Log in — जिज्ञासा library</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container">
    <h1 class="page-title">Log in</h1>
    <div class="card form-card">
        <div class="alert success" th:if="${success}" th:text="${success}"></div>
        <div class="alert success" th:if="${param.logout}">You've been logged out.</div>
        <div class="alert error" th:if="${param.error}">Incorrect email or password.</div>

        <form th:action="@{/login}" method="post">
            <label for="username">Email</label>
            <input type="email" id="username" name="username" required autofocus/>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required/>

            <button class="btn" type="submit">Log in</button>
        </form>
        <p style="margin-top:16px; font-size:0.85rem; color:var(--muted);">
            New here? <a th:href="@{/register}">Create an account</a>.<br/>
        </p>
    </div>
</main>
</body>
<!-- <div th:replace="~{fragments/footer :: footer}"></div> -->
</html>
